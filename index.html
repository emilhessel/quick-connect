<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quick Connect Questions</title>
  <meta name="description" content="Click for a random quick connect question." />
  <style>
    :root{
      --bg: #f6f7fb;
      --card: rgba(255,255,255,0.75);
      --text: #0f172a;
      --muted: #475569;
      --border: rgba(15, 23, 42, 0.10);
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.10);
      --radius: 18px;
    }
    *{ box-sizing: border-box; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color: var(--text);
      background:
        radial-gradient(1200px 700px at 15% 10%, #dbeafe 0%, transparent 60%),
        radial-gradient(1000px 600px at 85% 30%, #e9d5ff 0%, transparent 60%),
        radial-gradient(900px 550px at 40% 90%, #dcfce7 0%, transparent 60%),
        var(--bg);
      min-height: 100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 28px 16px;
    }
    .wrap{
      width: 100%;
      max-width: 720px;
    }
    header{
      margin-bottom: 16px;
    }
    h1{
      margin:0;
      font-size: clamp(22px, 4vw, 32px);
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    .sub{
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
      max-width: 55ch;
    }
    .card{
      background: var(--card);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .card-inner{
      padding: 18px;
    }
    .question{
      padding: 18px;
      border-radius: calc(var(--radius) - 6px);
      background: rgba(255,255,255,0.65);
      border: 1px solid rgba(15, 23, 42, 0.08);
      min-height: 120px;
      display:flex;
      align-items:center;
    }
    .question p{
      margin:0;
      font-size: clamp(18px, 2.5vw, 22px);
      line-height: 1.35;
    }
    .placeholder{
      color: var(--muted);
      font-size: 16px;
    }
    .controls{
      margin-top: 14px;
      display:flex;
      justify-content:flex-start;
    }
    button{
      appearance:none;
      border: 1px solid rgba(15, 23, 42, 0.12);
      background: #0f172a;
      color: white;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 14px;
      cursor:pointer;
      box-shadow: 0 6px 14px rgba(15, 23, 42, 0.12);
      transition: transform 0.05s ease, box-shadow 0.15s ease;
    }
    button:hover{
      box-shadow: 0 10px 18px rgba(15, 23, 42, 0.16);
    }
    button:active{
      transform: translateY(1px);
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.10);
    }
  </style>
</head>

<body>
  <main class="wrap">
    <header>
      <h1>Quick Connect</h1>
      <p class="sub">
        Click for a random question to spark a quick, human conversation.
        (Tip: press <b>Space</b> for a new one.)
      </p>
    </header>

    <section class="card">
      <div class="card-inner">
        <div class="question" aria-live="polite">
          <p id="questionText" class="placeholder">
            Click “Give me a question” to start.
          </p>
        </div>

        <div class="controls">
          <button id="nextBtn" type="button">Give me a question</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const QUESTIONS = [
      "What’s a project you’ve enjoyed working on recently, and why?",
      "What’s one skill you’d love to develop more (work-related or not)?",
      "How did you end up working in product management?",
      "What’s something you’ve learned from a work challenge or mistake?",
      "Who or what has influenced your approach to teamwork?",
      "What’s something you’re proud of (inside or outside of work) that most people don’t know?",
      "Have you read/watched/listened to anything recently that inspired you?",
      "What was your first job, and what did you learn from it?",
      "If you could master any skill instantly, what would it be?",
      "What do you like to do to recharge outside of work?",
      "Is there a book/movie/TV show you always recommend?",
      "If you could host a dinner party with any three people (living or dead), who would they be?",
      "What’s a quirky habit, routine, or tool that improves your day?",
      "What’s a fun fact about yourself that might surprise your teammates?",
      "What’s a childhood interest or hobby you wish you’d kept up?",
      "What’s one challenge you’re currently facing, or a recent win, and what did you learn?",
      "What’s something you wish more people understood about you?",
      "If you could solve one problem (big or small) for the team, what would it be?",
      "What kind of work energizes you versus drains you?",
      "If you weren’t in your current line of work, what would you imagine yourself doing?",
      "What’s a place you’d love to travel to, and why?",
      "If you had a “do-over” card for any moment in your career, when would you use it?",
      "Who’s a leader (in any field) you admire, and what would you ask them if you had coffee together?"
    ];

    const questionTextEl = document.getElementById("questionText");
    const nextBtn = document.getElementById("nextBtn");

    let lastIndex = -1;

    function pickRandomIndex(max, avoid) {
      if (max <= 1) return 0;
      let i = Math.floor(Math.random() * max);
      if (i === avoid) i = (i + 1) % max;
      return i;
    }

    function showNextQuestion() {
      const idx = pickRandomIndex(QUESTIONS.length, lastIndex);
      lastIndex = idx;
      questionTextEl.classList.remove("placeholder");
      questionTextEl.textContent = QUESTIONS[idx];
    }

    nextBtn.addEventListener("click", showNextQuestion);

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        showNextQuestion();
      }
    });
  </script>
</body>
</html>
